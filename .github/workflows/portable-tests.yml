name: Portable CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  RENV_CONFIG_REPOS_OVERRIDE: CRAN=https://packagemanager.posit.co/cran/__linux__/noble/2026-07-19

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: "4.4.3"
          use-public-rspm: false
          cran: "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-19"
      - name: Restore locked R environment
        uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          cache-version: 1
      - name: Verify locked R version and restored library
        run: |
          Rscript - <<'RSCRIPT'
          if (as.character(getRversion()) != "4.4.3") stop("Unexpected R version")
          if (!file.exists("renv.lock")) stop("renv.lock is missing")
          invisible(capture.output(status <- renv::status()))
          locked_packages <- status$lockfile$Packages
          installed_packages <- status$library$Packages
          missing_packages <- setdiff(names(locked_packages), names(installed_packages))
          identity_fields <- c("Version", "Source", "RemoteSha")
          mismatched_packages <- names(Filter(function(package) {
            any(vapply(identity_fields, function(field) {
              expected <- locked_packages[[package]][[field]]
              !is.null(expected) && !identical(installed_packages[[package]][[field]], expected)
            }, logical(1)))
          }, names(locked_packages)))
          if (length(missing_packages) > 0L || length(mismatched_packages) > 0L) {
            stop(sprintf(
              "Restored library does not match renv.lock; missing=%s; mismatched=%s",
              paste(missing_packages, collapse = ","),
              paste(mismatched_packages, collapse = ",")
            ))
          }
          RSCRIPT
      - name: Run complete portable suite
        run: Rscript scripts/tools/run_portable_suite.R
