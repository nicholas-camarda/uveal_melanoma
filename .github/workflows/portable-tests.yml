name: Portable CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: false
          cran: "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-19"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::lintr
            any::tidyverse
            any::readxl
            any::writexl
            any::openxlsx
            any::lubridate
            any::janitor
            any::broom.helpers
            any::parameters
            any::gtsummary
            any::survival
            any::survminer
            any::survRM2
            any::gt
            any::cardx
            any::forestploter
            any::gridExtra
            any::cowplot
            any::ggsurvfit
            any::tidycmprsk
            any::logger
            any::progressr
            any::here
            any::usethis
            any::testthat
            any::rms
            any::pec
            bioc::survcomp
            any::riskRegression
            any::cmprsk
            any::timeROC
            any::pROC
            github::mdbrown/rmda
            any::VIM
            any::mice
            any::glmnet
      - name: Run portable regression suite
        run: Rscript scripts/tools/run_testthat.R tests/testthat
      - name: Run feasible integration suite
        env:
          OCULAR_RUN_INTEGRATION_TESTS: true
        run: Rscript scripts/tools/run_testthat.R tests/integration
      - name: Run lintr
        run: Rscript -e "lints <- lintr::lint_package(); if (length(lints) > 0L) { print(lints); stop(sprintf('%d lint(s) found', length(lints))) }"
