  id: "30085896"
  submitted_cohort_n: 260
  subgroup_counts_reported: false
  auc:
    direct_mfs: 0.686
    direct_mss: 0.663
    molecular_surrogate: 0.515
  observed_rates:
    class_1:
      mfs: 0.029
      mss: 0.000
    not_tested:
      mfs: 0.150
      mss: 0.091
    failed_indeterminate:
      mfs: 0.600
      mss: 0.333
    class_2:
      mfs: 0.537
      mss: 0.383
  conclusions:
    - id: moderate_direct_prognostic_stratification
      category: moderate_direct_prognostic_stratification
      workbook_labels:
        - takeaway_1
    - id: failure_to_recover_molecular_class
      category: failure_to_recover_molecular_class
      workbook_labels:
